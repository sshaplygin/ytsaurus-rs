# Python tooling for this workspace.
#
# There is no Python package here and there never will be — this repository is
# a Rust workspace. The 14 `.py` files are its automation: the checks CI runs,
# the benchmark comparison it posts, the helpers that drive the local-cluster
# end-to-end run, and the one that regenerates the C++ Skiff vectors.
# This file configures the tools that keep them honest — `ruff` for lint and
# format, `ty` for types — so they are checked the same way for everyone,
# instead of each file drifting to whatever its author's editor did.
#
# Run it through uv, so nothing has to be installed first:
#
#     uvx ruff check .
#     uvx ruff format .
#     uvx ty check scripts tests

[tool.ruff]
# Matches `actions/setup-python` in cluster-e2e.yml. The Skiff vector script
# needs 3.10 or newer for `int | None` in a signature; 3.11 is what CI has.
target-version = "py311"
line-length = 100

# `third_party/` is someone else's repository, checked out read-only; ruff would
# otherwise reformat upstream's `conanfile.py` and leave the submodule dirty.
# Agent worktrees under `.claude/` are whole copies of *this* repository, so
# without excluding them every `.py` file is linted once per worktree, against
# whatever revision that worktree happens to sit on.
#
# Neither directory exists in CI, which is exactly why both belong here: the
# command in AGENTS.md must mean the same thing on a developer's machine as it
# does in the workflow.
extend-exclude = [".claude", "third_party"]

[tool.ruff.lint]
# Beyond the default `E4,E7,E9,F`: import order, bugbears, comprehensions,
# pyupgrade and the pytest-style asserts these scripts use. Nothing here is
# a library, so the docstring and annotation rule sets would be noise.
select = ["E", "F", "W", "I", "B", "C4", "UP", "RUF"]

# Type checking, with **ty** — astral's, like ruff and uv, so the whole Python
# toolchain is one family and one binary each. `mypy --strict` was used first
# and was equally clean; the switch is for that consistency, not because either
# found something the other missed.
#
#     uvx ty check scripts tests
#
# There is deliberately no rule configuration here. The two untyped third-party
# imports — `yt`, the official YTsaurus Python client, and `yt_yson_bindings`, a
# compiled C extension over upstream's `library/cpp/skiff` — are suppressed with
# a `# ty: ignore[unresolved-import]` on each import line instead. Turning
# `unresolved-import` off project-wide would have been one line, and would also
# have hidden a typo in a first-party import: a check that cannot fail is the
# failure mode this repository has already shipped.
[tool.ty.environment]
python-version = "3.11"
