name: Benchmarks

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/benchmarks.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      # No bench target compiles these. Cargo still needs every declared
      # [[example]] file to exist to load the workspace; ci.yml fails when one
      # is missing. A negative pattern has to follow the positive one it
      # narrows.
      - "!crates/**/*.md"
      - "!crates/*/examples/**"
      - "!crates/*/tests/**"
      - ".cargo/config.toml"
      - "rust-toolchain.toml"
      - "scripts/benchmark_report_inputs.go"
      - ".github/benchmark-report.json"

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  compare:
    name: "${{ matrix.name }}: main vs PR"
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: yson
            name: YSON codec
            package: ytsaurus-yson
            bench: yson_benchmark
          - suite: skiff
            name: Skiff codec
            package: ytsaurus-skiff
            bench: codec_throughput
          - suite: job
            name: job path
            package: ytsaurus-job
            bench: job_throughput
          - suite: client
            name: HTTP client
            package: ytsaurus-client
            bench: rows
    steps:
      # The four suites run in parallel, but the two revisions of each suite
      # intentionally share one VM and one toolchain. This makes each
      # PR-vs-main delta meaningful; GitHub-hosted runners are still noisy, so
      # the report is advisory rather than a merge gate.
      - name: Check out the PR base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Check out the PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false

      # Use the PR's pinned compiler for both revisions. A toolchain change is
      # then not mistaken for a source-level performance change.
      - name: Install toolchain
        working-directory: pr
        run: |
          rustup show active-toolchain || rustup toolchain install
          toolchain=$(rustup show active-toolchain)
          printf 'RUSTUP_TOOLCHAIN=%s\n' "${toolchain%% *}" >> "$GITHUB_ENV"

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            base -> target
            pr -> target

      - name: Benchmark main
        working-directory: base
        run: |
          set -o pipefail
          cargo bench --locked -p "${{ matrix.package }}" \
            --bench "${{ matrix.bench }}" -- --noplot 2>&1 | tee benchmarks.txt

      - name: Benchmark pull request
        working-directory: pr
        run: |
          set -o pipefail
          cargo bench --locked -p "${{ matrix.package }}" \
            --bench "${{ matrix.bench }}" -- --noplot 2>&1 | tee benchmarks.txt

      - name: Install the input-producer runner
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Record the shared compiler and runner environment
        run: go run pr/scripts/benchmark_report_inputs.go record

      - name: Upload benchmark logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-main-vs-pr-${{ matrix.suite }}
          path: |
            base/benchmarks.txt
            pr/benchmarks.txt
            environment.json
          retention-days: 14

  report:
    name: "Criterion: aggregate PR comparison"
    needs: compare
    runs-on: ubuntu-24.04
    outputs:
      gate: ${{ steps.report.outputs.gate }}
    steps:
      - name: Check out PR reporting configuration and input assembly
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          persist-credentials: false
      - name: Download all four completed suites
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: criterion-main-vs-pr-*
          path: benchmark-logs
      - name: Install the input-producer runner
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.0'
          cache: false
      - name: Assemble explicit suite manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: go run pr/scripts/benchmark_report_inputs.go assemble --logs benchmark-logs --output manifests
      - name: Generate complete report and bounded comment
        id: report
        uses: sshaplygin/benchmark-report/report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          parser: criterion
          base-manifest: manifests/base.json
          head-manifest: manifests/head.json
          config: pr/.github/benchmark-report.json
          comment-header: benchmark-report-criterion
      - name: Upload complete report and replay inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: criterion-main-vs-pr-report
          path: ${{ steps.report.outputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: "Criterion: publish comparison"
    needs: report
    if: ${{ !cancelled() && needs.report.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Download the generated report bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: criterion-main-vs-pr-report
          path: bundle
      - name: Append the complete summary
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/report.md
          header: benchmark-report-criterion
          publish: 'false'
      - name: Publish the bounded comment when eligible
        uses: sshaplygin/benchmark-report@f71129f2bebcf57f953b27607b7d8bb8c23afae9 # v0.1.0
        with:
          report-path: bundle/comment.md
          header: benchmark-report-criterion
          summary: 'false'
      - name: Apply the configured gate after publication
        if: needs.report.outputs.gate == 'failed'
        run: exit 1
