name: Cluster E2E

# A push to main is the post-merge event for pull requests. Keep the
# Docker-backed check out of pull requests: it is substantially slower than the
# captured-fixture e2e test which remains part of every CI run.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  cluster-e2e:
    name: local-cluster e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the channel and includes the musl target used
      # by the workers uploaded to the Linux/x86_64 local cluster.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: astral-sh/setup-uv@v5

      # run_e2e.sh deliberately reads tables through the official client: the
      # worker output must agree with an independent YSON implementation.
      #
      # Installed into the interpreter set up above rather than into a virtual
      # environment, because `run_e2e.sh` and `run_local_cluster.sh` call bare
      # `python3` and `yt`, and are run by hand as often as by CI. `uv pip` is
      # here for the resolver's speed, not to change where things land.
      - name: Install the YTsaurus CLI and binary YSON bindings
        run: uv pip install --system ytsaurus-client ytsaurus-yson

      - name: Start a local YTsaurus cluster
        run: tests/e2e/run_local_cluster.sh

      - name: Run the local-cluster end-to-end tests
        run: tests/e2e/run_e2e.sh

      # The containers are ephemeral runners, but their logs make a failed
      # scheduler operation diagnosable directly from the Actions run.
      - name: Show local-cluster logs after a failure
        if: failure()
        run: |
          docker ps -a
          docker logs yt.backend || true
          docker logs yt.frontend || true

      - name: Stop the local YTsaurus cluster
        if: always()
        run: tests/e2e/run_local_cluster.sh --stop
