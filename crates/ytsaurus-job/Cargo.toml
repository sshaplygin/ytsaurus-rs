[package]
name = "ytsaurus-job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Runtime for writing YTsaurus MapReduce jobs in Rust: streaming YSON row reader, control records, multi-table output"
readme = "README.md"
keywords = ["ytsaurus", "mapreduce", "yson", "job"]
categories = ["encoding"]
# `examples/selfrun.rs` is the one example that needs `ytsaurus-client`, which
# is a **version-less** dev-dependency here so that two published crates do not
# become cyclic. Cargo drops such a dependency from the published manifest — so
# a `selfrun.rs` that shipped would be an example nobody could build from the
# registry, failing on an import of a crate the manifest no longer names. The
# other eight need only this crate's own dependencies and ship as they are.
#
# `tests/cat_e2e.rs` is excluded for a different reason: it `include_bytes!`s
# golden fixtures from `tests/cluster-e2e/fixtures/`, which is outside this
# package and so is not in the tarball. `include_bytes!` resolves at compile
# time, so shipping that file gives anyone who unpacks the crate and runs
# `cargo test` a build error and no way to fix it. The other e2e tests build the
# example workers, which *are* published, and are left in.
exclude = ["examples/selfrun.rs", "tests/cat_e2e.rs", "tests/skiff_reader_tests.rs"]

[dependencies]
ytsaurus-yson.workspace = true
ytsaurus-skiff.workspace = true
ytsaurus-format.workspace = true
serde.workspace = true
thiserror.workspace = true

[features]
# Gives the `selfrun` example TLS, for a cluster reached over https. Off by
# default, and it affects **nothing but that example**: this crate's library has
# no HTTP in it at all. It exists because `selfrun` is the one worker that is
# also a launcher, so it needs `ytsaurus-client` — and a musl worker build must
# not drag in `rustls`, which reaches `ring`, which wants a C cross-compiler.
#
#   cargo run -p ytsaurus-job --example selfrun --features example-tls
#
# **In the published crate this feature is empty and does nothing.** It turns on
# a feature of `ytsaurus-client`, which is a version-less dev-dependency that
# cargo drops on publish, and the example it serves is excluded from the package
# too — so the registry manifest carries `example-tls = []`. It is kept because
# the repository is where `selfrun` is built, and removing it would break the
# documented command above.
example-tls = ["ytsaurus-client/tls"]

[dev-dependencies]
serde_bytes.workspace = true
serde.workspace = true
criterion.workspace = true
# For the `selfrun` example only, which is launcher and job in one binary.
#
# **Path and no version, deliberately.** `ytsaurus-client` dev-depends on this
# crate in turn, so a version here would make two published crates cyclic and
# deadlock every release after it — 0.2.6 of either would need 0.2.6 of the
# other already on crates.io. Cargo drops a version-less dev-dependency from the
# published manifest, which is what makes the cycle a local build detail rather
# than something a consumer of either crate can see.
#
# `default-features = false` is what keeps TLS out of the worker build; see the
# `example-tls` feature above.
ytsaurus-client = { path = "../ytsaurus-client", default-features = false }

# Four of the workers carry unit tests of their own — the counting in
# `wordcount`, the sessionising in `sessionize`, the shard arithmetic in
# `shards`, the statistics in `counted` — sixteen in all, testing functions that
# are private to a worker and have no business being public API.
#
# **`test = true` is what keeps them running.** Cargo runs the unit tests inside
# a `[[bin]]`, which is what these were, and does *not* run the ones inside an
# example unless the target says so: the default is `test = false`. Moving them
# here without this line dropped all sixteen and left the suite green, which is
# the only kind of regression worth writing eight lines about.
[[example]]
name = "counted"
test = true

[[example]]
name = "sessionize"
test = true

[[example]]
name = "shards"
test = true

[[example]]
name = "wordcount"
test = true

[[bench]]
name = "job_throughput"
harness = false
