[package]
name = "ytsaurus-skiff"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Schema and streaming codec for the YTsaurus Skiff format (work in progress)"
# Published from 0.2.5, by the human decision Hard rule 1 asks for. The ship
# gates in docs/skiff-compatibility.md are **still not all green** — required
# test 4, cluster fixtures, is open — and this crate remains pre-release in
# everything but its presence on crates.io: the version is 0.x, the README says
# what is unsettled, and the API may change in a patch release. What the publish
# buys is `ytsaurus-job` and `ytsaurus-client`, which depend on this and could
# not otherwise reach crates.io at all.
readme = "README.md"
keywords = ["ytsaurus", "skiff", "serialization", "mapreduce"]
categories = ["encoding"]

# `tests/cpp_interop.rs` and `tests/wire.rs` `include_str!` reference vectors
# from `tests/skiff-cpp-interop/` and `tests/skiff-go-interop/`, which are
# outside this package and so are not in the tarball. `include_str!` resolves at
# compile time, so shipping either hands anyone who unpacks the crate a build
# error they cannot fix. The vectors and the tests both live in the repository,
# where they run. `scripts/check-package-includes.sh` is what keeps this list
# honest.
exclude = ["tests/cpp_interop.rs", "tests/wire.rs"]

[dependencies]
ytsaurus-yson.workspace = true
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "codec_throughput"
harness = false
