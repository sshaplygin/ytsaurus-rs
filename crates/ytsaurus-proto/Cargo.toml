[package]
name = "ytsaurus-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Generated protobuf bindings for the YTsaurus RPC proxy, built from the upstream .proto files"
keywords = ["ytsaurus", "protobuf", "prost", "rpc"]
categories = ["network-programming", "encoding"]
readme = "README.md"

# Not published. `cargo package` does not include submodules, so publishing
# this crate needs the generated code committed first — see the ship gates in
# docs/rpc-compatibility.md.
publish = false

[dependencies]
prost = "0.14"

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.1"
