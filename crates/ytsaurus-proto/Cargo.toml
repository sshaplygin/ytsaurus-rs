[package]
name = "ytsaurus-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Generated protobuf bindings for the YTsaurus RPC proxy, built from the upstream .proto files"
keywords = ["ytsaurus", "protobuf", "prost", "rpc"]
categories = ["network-programming", "encoding"]
readme = "README.md"

# The generated Rust under `src/generated/` is committed, and there is no build
# script: `cargo package` does not walk into a submodule, so generating at build
# time produces a crate that builds from this repository and fails from the
# registry. Regeneration is `cargo xtask generate-protos`, and CI fails on a
# diff. The submodule remains the only source of `.proto` files — no copy of
# them is kept here.

[dependencies]
prost = "0.14"
