[package]
name = "ytsaurus-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Thin YTsaurus HTTP API v4 client: upload worker binaries, start operations, poll them to completion"
readme = "README.md"
keywords = ["ytsaurus", "mapreduce", "client", "yson"]
categories = ["api-bindings"]

[features]
default = ["tls"]
# TLS, and so `https://` proxies. On by default; turning it off is what lets a
# worker binary that also launches operations be cross-compiled to musl without
# a C toolchain — `rustls` pulls in `ring`, which needs one. A local cluster is
# reached over plain HTTP and needs none of it.
tls = ["ureq/rustls"]
# Trust whatever the operating system trusts, rather than the Mozilla bundle
# compiled into `webpki-roots`. Off by default: it pulls in
# `rustls-platform-verifier`, and the Mozilla bundle is the safer default for a
# client that may run outside the network it is talking to. `YT_CA_BUNDLE`
# covers the same ground without the dependency, and is checked first.
platform-verifier = ["tls", "ureq/platform-verifier"]
# `#[derive(TableRow)]`, so a schema is read off the struct the rows already
# have. Off by default: it is a compiler plugin, and a crate that only launches
# operations should not pay to build one.
derive = ["dep:ytsaurus-helpers"]
# Spans and events through the `tracing` facade: one span per attempt, and the
# retry message as a `WARN` event instead of a line on stderr. Off by default
# for the same reason `tls` is — this crate is linked into worker binaries, and
# a worker should carry only what it runs on. Sending a `traceparent` to the
# cluster, which is the other half of being observable, needs none of this and
# is always compiled in: see `TraceContext`.
tracing = ["dep:tracing"]

[dependencies]
ytsaurus-yson.workspace = true
ytsaurus-skiff.workspace = true
ytsaurus-format.workspace = true
serde.workspace = true
thiserror.workspace = true
ureq = { version = "3.3", default-features = false, features = ["gzip"] }
serde_json = "1.0"
# The file cache is keyed by MD5, so the client has to compute one. Chosen for
# having no dependencies of its own: this crate is linked into worker binaries
# that cross-compile to musl with nothing but the Rust toolchain.
md5 = "0.8"
ytsaurus-helpers = { workspace = true, optional = true }
# The facade only, and without `attributes`: `#[instrument]` is a proc macro,
# and the one span here is opened by hand, at the single seam (`retry::run`)
# that every command passes through. What is left is
# `tracing` with its `pin-project-lite`, and `tracing-core` with its
# `once_cell` — three crates more to compile on a default build, which already
# has `once_cell` by way of `rustls`, and four without TLS.
tracing = { version = "0.1", default-features = false, features = [
    "std",
], optional = true }

[dev-dependencies]
serde_bytes.workspace = true
# The examples derive schemas; users get the same through the `derive` feature.
ytsaurus-helpers.workspace = true
# Not a dependency: the client sends bytes and the job runtime decodes them, and
# keeping that direction one-way is deliberate. It is here because a streamed
# table is exactly what a job reads, and the example that says so should be
# compiled rather than asserted.
ytsaurus-job.workspace = true
criterion.workspace = true
# Compresses a test response, which is the only way to show that a buffered
# read's cap counts *decoded* bytes: a body small enough on the wire to pass
# any limit put there, and large enough once inflated to fail the real one.
# Already in the tree — `ureq`'s `gzip` feature is what inflates it again.
flate2 = "1"

[[bench]]
name = "rows"
harness = false

[package.metadata.docs.rs]
all-features = true
