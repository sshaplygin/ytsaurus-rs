[package]
name = "ytsaurus-rpc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "YTsaurus RPC proxy client: bus framing, RPC envelope and the dynamic-table row wire format"
keywords = ["ytsaurus", "rpc", "bus", "protobuf"]
categories = ["network-programming", "database"]
readme = "README.md"

# Published from 0.3.0, by the human decision Hard rule 1 asks for. The ship
# gates in docs/rpc-compatibility.md are **not all green** — gate D, the HTTP
# `discover_proxies` bootstrap, is open — and this crate is **pre-release** in
# everything but its presence on crates.io: the version is 0.x, the README and
# the compatibility document say what is unimplemented, and the API may change
# in a patch release. The scope is deliberately narrow: transactions,
# `lookup_rows`, `select_rows` and `modify_rows`, not the other 150 request
# types.

[dependencies]
ytsaurus-api.workspace = true
ytsaurus-proto.workspace = true

bytes = "1.10"
prost = "0.14"
thiserror.workspace = true
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
tokio = { version = "1", default-features = false, features = [
    "net",
    "rt",
    "sync",
    "time",
    "macros",
    "io-util",
] }

[dev-dependencies]
proptest.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
