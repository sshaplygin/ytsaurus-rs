[workspace]
resolver = "3"
members = [
    "crates/ytsaurus-yson",
    "crates/ytsaurus-skiff",
    "crates/ytsaurus-format",
    "crates/ytsaurus-job",
    "crates/ytsaurus-client",
    "crates/ytsaurus-helpers",
    "crates/ytsaurus-api",
    "crates/ytsaurus-proto",
    "crates/ytsaurus-rpc",
    "xtask",
]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/sshaplygin/ytsaurus-rs"
homepage = "https://github.com/sshaplygin/ytsaurus-rs"
authors = ["Sam Shaplygin <semyuon@gmail.com>"]

[workspace.dependencies]
ytsaurus-yson = { path = "crates/ytsaurus-yson", version = "0.3.1" }
ytsaurus-skiff = { path = "crates/ytsaurus-skiff", version = "0.3.1" }
ytsaurus-format = { path = "crates/ytsaurus-format", version = "0.3.1" }
ytsaurus-job = { path = "crates/ytsaurus-job", version = "0.3.1" }
ytsaurus-client = { path = "crates/ytsaurus-client", version = "0.3.1" }
ytsaurus-helpers = { path = "crates/ytsaurus-helpers", version = "0.3.1" }
ytsaurus-api = { path = "crates/ytsaurus-api", version = "0.3.1" }
ytsaurus-proto = { path = "crates/ytsaurus-proto", version = "0.3.1" }
ytsaurus-rpc = { path = "crates/ytsaurus-rpc", version = "0.3.1" }

serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
ryu = "1.0"
itoa = "1.0"
memchr = "2.8"

serde_bytes = "0.11"
# Pinned below 0.8, and the reason is the musl worker build. 0.8 added a
# dependency on `alloca`, whose build script wants a C cross-compiler — and
# cargo compiles a package's dev-dependencies whenever it builds that package's
# *examples*, which is what the workers under `crates/ytsaurus-job/examples/`
# are. With 0.8, `scripts/build-worker.sh` fails on any machine without
# `x86_64-linux-musl-gcc`, which is every machine it advertises itself as
# working on. Nothing here uses a 0.8 feature.
criterion = "0.7"
proptest = "1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
incremental = false

# Worker profile for job binaries shipped to a YTsaurus cluster.
#
# `panic = "abort"` lives HERE and only here: it is a whole-graph profile
# setting, so putting it in `[profile.release]` would force it on the library
# crates and on anyone who depends on them. Build workers with:
#
#     cargo build -p ytsaurus-job --examples --profile release-worker \
#         --target x86_64-unknown-linux-musl
[profile.release-worker]
inherits = "release"
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
