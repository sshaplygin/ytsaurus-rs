[package]
name = "ytsaurus-examples"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Example YTsaurus worker binaries built on ytsaurus-job"
publish = false

[features]
# Give the launcher role TLS, for a cluster reached over https. Off by default:
# the workers here are cross-compiled to musl, and TLS would drag in a C
# toolchain (see the `tls` feature of ytsaurus-client). A local cluster is plain
# HTTP.
tls = ["ytsaurus-client/tls"]

[dependencies]
ytsaurus-job.workspace = true
ytsaurus-skiff.workspace = true
ytsaurus-yson.workspace = true
# `default-features = false` drops TLS, which is what keeps
# `scripts/build-worker.sh` working with nothing but the Rust toolchain. Spelled
# out rather than inherited: cargo does not let an inherited dependency turn off
# default features.
ytsaurus-client = { path = "../crates/ytsaurus-client", default-features = false }
serde.workspace = true
serde_bytes.workspace = true
